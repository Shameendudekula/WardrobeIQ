<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log in | WardrobeIQ</title>
  <meta name="description" content="Log in to WardrobeIQ to see your wardrobe and AI outfit suggestions.">
  <meta name="theme-color" content="#081028">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <div class="bg-fx" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <main class="auth-shell">
    <!-- Brand panel -->
    <aside class="auth-art" aria-hidden="true">
      <a class="brand" href="/">
        <span class="brand-mark"><svg viewBox="0 0 32 32"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbd58a"/><stop offset="1" stop-color="#ef8a7c"/></linearGradient></defs><path d="M13 6.5a3 3 0 1 1 3 3v2.2L4.6 20.2a1.8 1.8 0 0 0 1 3.3h20.8a1.8 1.8 0 0 0 1-3.3L16 11.7" fill="none" stroke="url(#bm)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Wardrobe<b>IQ</b></span>
      </a>
      <div class="art-stage">
        <figure class="art-card c1"><img src="assets/sample2.png" alt=""></figure>
        <figure class="art-card c2"><img src="assets/sample1.png" alt=""></figure>
        <div class="art-chip"><span class="pulse-dot"></span> 3 outfits ready for today</div>
      </div>
      <blockquote class="art-quote">
        <p>Your closet already has the perfect outfit. We just help you find it.</p>
        <footer>— WardrobeIQ</footer>
      </blockquote>
    </aside>

    <!-- Form panel -->
    <section class="auth-panel">
      <a class="brand auth-mobile-brand" href="/"><span>Wardrobe<b>IQ</b></span></a>
      <div class="auth-card">
        <h1 data-reveal>Welcome back <span class="wave">👋</span></h1>
        <p class="muted" data-reveal style="--i:1">Log in to see today's outfit ideas.</p>
        <form id="loginForm" novalidate data-stagger>
          <div class="field" data-reveal>
            <input id="loginEmail" type="email" placeholder=" " autocomplete="email" required />
            <label for="loginEmail">Email</label>
          </div>
          <div class="field" data-reveal>
            <input id="loginPassword" type="password" placeholder=" " autocomplete="current-password" required />
            <label for="loginPassword">Password</label>
            <button type="button" class="toggle-pw" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-reveal>Log in <span class="arrow">→</span></button>
        </form>
        <p class="auth-switch" data-reveal style="--i:6">New to WardrobeIQ? <a href="/signup">Create an account</a></p>
      </div>
    </section>
  </main>

  <script src="ui.js"></script>
  <script src="script.js"></script>
</body>
</html>
